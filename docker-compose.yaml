# Settings come from .env next to this file (copy .env.example). Only the
# dashboard and the API are published; the database and Redis are reachable
# only by the other containers, never from the network.
services:
  # MongoDB service
  textbee-db:
    container_name: textbee-db
    image: mongo:latest
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-adminUser}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS:?Set MONGO_ROOT_PASS in .env (see .env.example)}
      - MONGO_INITDB_DATABASE=textbee
    volumes:
      # - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongodb_data:/data/db
    # No published port. To reach it from this computer for maintenance, use
    # docker exec (see docs/SETUP.md) or start mongo-express below.
    networks:
      - textbee-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MongoDB Express, a database admin UI. Off by default; start it only when
  # you need it with: docker compose --profile tools up -d mongo-express
  # It listens on this computer only (http://localhost:8081) and asks for a
  # login: user MONGO_EXPRESS_USER (default admin), password MONGO_EXPRESS_PASS
  # (defaults to MONGO_ROOT_PASS).
  mongo-express:
    container_name: textbee-mongo-express
    image: mongo-express:latest
    profiles: ["tools"]
    restart: "no"
    ports:
      - "127.0.0.1:${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USER:-adminUser}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASS}
      - ME_CONFIG_MONGODB_SERVER=textbee-db
      - ME_CONFIG_BASICAUTH_ENABLED=true
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASS:-${MONGO_ROOT_PASS}}
    depends_on:
      textbee-db:
        condition: service_healthy
    networks:
      - textbee-network

  # NestJS API
  textbee-api:
    container_name: textbee-api
    # image: ghcr.io/textbee/textbee/api:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    # BIND_ADDRESS limits which network can reach it: 0.0.0.0 is every
    # network, a NetBird or Tailscale address is only that private network.
    ports:
      - "${API_BIND_ADDRESS:-${BIND_ADDRESS:-0.0.0.0}}:${API_PORT:-3001}:3001"
    env_file:
      - ./api/.env
    environment:
      - PORT=3001
      - REDIS_URL=redis://textbee-redis:6379
      # Built from .env so the API always uses the database's real password,
      # whatever an older api/.env says.
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-adminUser}:${MONGO_ROOT_PASS}@textbee-db:27017/textbee?authSource=admin
      # Sign-in settings, shared with the dashboard (see .env.example).
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_NAME=${OIDC_NAME:-}
      - PASSWORD_LOGIN=${PASSWORD_LOGIN:-}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-}
      - OIDC_ALLOWED_GROUPS=${OIDC_ALLOWED_GROUPS:-}
      - OIDC_ALLOW_SIGNUP=${OIDC_ALLOW_SIGNUP:-}
      - OIDC_TRUST_EMAIL=${OIDC_TRUST_EMAIL:-}

    depends_on:
      textbee-db:
        condition: service_healthy
    networks:
      - textbee-network

  # Next.js Web
  textbee-web:
    container_name: textbee-web
    # image: ghcr.io/textbee/textbee/web:latest
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${WEB_BIND_ADDRESS:-${BIND_ADDRESS:-0.0.0.0}}:${WEB_PORT:-3000}:3000"
    env_file:
      - ./web/.env
    environment:
      - PORT=3000
      # Sign-in settings, shared with the dashboard (see .env.example).
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_NAME=${OIDC_NAME:-}
      - PASSWORD_LOGIN=${PASSWORD_LOGIN:-}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}

    depends_on:
      - textbee-api
    networks:
      - textbee-network

  # Redis (if SMS queue is needed)
  textbee-redis:
    container_name: textbee-redis
    image: redis:alpine
    restart: always
    # No published port: only the API talks to Redis.
    volumes:
      - redis_data:/data
    networks:
      - textbee-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  textbee-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data: 